[package]
name = "civic-sentinel-api"
version = "0.1.0"
edition = "2021"
authors = ["FirstPrinciples-Sun <rtchanaphon@gmail.com>"]
description = "Civic issue reporting and tracking platform"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FirstPrinciples-Sun/civic-sentinel"
rust-version = "1.75"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["ws", "macros", "multipart"] }
tokio = { version = "1.35", features = ["full"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-full", "limit", "fs"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
libsql = "0.3"

# Authentication
jsonwebtoken = "9.2"
argon2 = "0.5"
rand = "0.8"

# Validation
validator = { version = "0.16", features = ["derive"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
once_cell = "1.19"
thiserror = "1.0"
anyhow = "1.0"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
config = "0.14"
dotenvy = "0.15"

# Security
headers = "0.4"
sha2 = "0.10"

# System
num_cpus = "1.16"

[dev-dependencies]
reqwest = { version = "0.11", features = ["json"] }
tokio-test = "0.4"
