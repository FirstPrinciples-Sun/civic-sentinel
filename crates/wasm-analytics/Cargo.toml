[package]
name = "civic-sentinel-wasm"
version = "0.1.0"
edition = "2021"
authors = ["FirstPrinciples-Sun <rtchanaphon@gmail.com>"]
description = "WebAssembly analytics module for Civic Sentinel"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Window",
  "Document",
  "HtmlElement",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"
